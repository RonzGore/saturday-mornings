<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- C · "On-air dial": a modern app tile. A clock face whose lit wedge is
       made of colour bars (the hours the channel is on), with a play button
       at the centre. Says "TV that runs on a schedule" at a glance. -->
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16206B"/><stop offset="1" stop-color="#0A0F33"/>
    </linearGradient>
    <clipPath id="wedge"><path d="M256 256 L256 92 A164 164 0 0 1 398 338 Z"/></clipPath>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#cbg)"/>
  <circle cx="256" cy="256" r="172" fill="#1E2A80"/>
  <g clip-path="url(#wedge)">
    <rect x="256" y="80" width="26" height="300" fill="#E9E9E9"/>
    <rect x="282" y="80" width="26" height="300" fill="#FFE14D"/>
    <rect x="308" y="80" width="26" height="300" fill="#4FE0E8"/>
    <rect x="334" y="80" width="26" height="300" fill="#5BE36B"/>
    <rect x="360" y="80" width="26" height="300" fill="#E95BE8"/>
    <rect x="386" y="80" width="26" height="300" fill="#FF5A5F"/>
    <rect x="412" y="80" width="26" height="300" fill="#4D6BFF"/>
  </g>
  <!-- hour ticks -->
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity=".85">
    <path d="M256 104 v18"/><path d="M256 390 v18"/><path d="M104 256 h18"/><path d="M390 256 h18"/>
  </g>
  <circle cx="256" cy="256" r="84" fill="#0A0F33" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M236 216 L300 256 L236 296 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="404" cy="108" r="22" fill="#FF3B4E"/>
</svg>
